# Optional single-process loopback example for Collector Contrib v0.165.0.
# Does not start from the Mocker configuration or ship with Mocker runtime dependencies.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318

processors:
  filter/mocker:
    error_mode: propagate
    metrics:
      metric:
        - >-
          name != "qaas.mocker.requests.accepted" and
          name != "qaas.mocker.requests.completed" and
          name != "qaas.mocker.request.duration"

exporters:
  prometheus:
    endpoint: 127.0.0.1:19464
    translation_strategy: UnderscoreEscapingWithSuffixes
    without_scope_info: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [filter/mocker]
      exporters: [prometheus]
